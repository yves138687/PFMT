[project]
name = "pfmt-server"
version = "0.1.0"
description = "PFMT FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
